# Production stack for the VPS: Postgres + API + Caddy (HTTPS, web admin).
# Secrets and domains come from .env next to this file (see .env.example).
#   docker compose -f docker-compose.prod.yml up -d --build

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fourume
      POSTGRES_USER: fourume
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fourume -d fourume"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fourume;Username=fourume;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env}
      Jwt__Issuer: 4UME
      Jwt__Audience: 4UME
      Media__Path: /app/media
      # Creates admin@4ume.com on a fresh database (ignored once the account exists).
      Admin__InitialPassword: ${ADMIN_INITIAL_PASSWORD:-}
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy.Dockerfile
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    logging: *logging

volumes:
  pg_data:
  media:
  caddy_data:
  caddy_config:
