services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fourume
      POSTGRES_USER: fourume
      POSTGRES_PASSWORD: fourume
    ports:
      - "5432:5432"
    volumes:
      - fourume_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fourume -d fourume"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Use host-gateway so API can reach Postgres via published host port
      # (some agent VMs block container-to-container bridge traffic).
      ConnectionStrings__Default: Host=host.docker.internal;Port=5432;Database=fourume;Username=fourume;Password=fourume
      Jwt__Key: 4ume-dev-secret-key-change-in-production-32chars!
      Jwt__Issuer: 4UME
      Jwt__Audience: 4UME
      Vocabulary__Path: /app/data/vocabulary.json
      Grammar__Path: /app/data/grammar
      Listening__Path: /app/data/listening
      # Comma-separated emails granted the admin role at startup (accounts must already exist).
      Admin__Emails: lamvo1978@gmail.com
      Media__Path: /app/media
      # Stock photo search in the admin; put the keys in .env next to this file (git-ignored).
      StockImages__PexelsKey: ${PEXELS_API_KEY:-}
      StockImages__PixabayKey: ${PIXABAY_API_KEY:-}
      # Without a key, sign-up and reset codes are only printed in the API log.
      Email__ResendKey: ${RESEND_API_KEY:-}
      # Azure Speech (free F0) for listening audio; without it the app reads scripts with the device voice.
      Speech__Key: ${AZURE_SPEECH_KEY:-}
      Speech__Region: ${AZURE_SPEECH_REGION:-}
    volumes:
      - fourume_media:/app/media
    ports:
      - "5088:5088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  fourume_pg:
  fourume_media:
