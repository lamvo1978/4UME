# Static web admin. /api and /media are routed to the API by the edge proxy in front of this container.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# Public site at 4ume.io.vn (support, privacy policy, account deletion); the edge proxy keeps the Host header.
server {
    listen 80;
    server_name 4ume.io.vn;
    root /usr/share/nginx/site;
    # "/privacy" -> "/privacy/" must keep the visitor's https scheme and host, not this container's.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
