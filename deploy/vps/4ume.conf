# 4UME sites on the shared edge nginx. Copy to /opt/pethubpro/edge/nginx/4ume.conf, then:
#   docker exec pethubpro-edge-nginx nginx -t && docker exec pethubpro-edge-nginx nginx -s reload
#
# Upstreams are resolved per request through Docker's DNS, so nginx still starts (and PetHubPro keeps
# working) while the 4UME containers are stopped; only these two hosts then answer 502.
# Certificate: /opt/pethubpro/certs/4ume.io.vn/{fullchain,privkey}.pem on the host (see docs/deploy.md).

server {
    listen 80;
    listen [::]:80;
    server_name api.4ume.io.vn admin.4ume.io.vn;
    return 301 https://$host$request_uri;
}

# Mobile app API and uploaded images.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.4ume.io.vn;

    ssl_certificate     /etc/nginx/certs/4ume.io.vn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/4ume.io.vn/privkey.pem;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $fourume_api http://4ume-api:5088;

    client_max_body_size 16m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass $fourume_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Web admin; /api and /media go to the API so the admin stays same-origin.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.4ume.io.vn;

    ssl_certificate     /etc/nginx/certs/4ume.io.vn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/4ume.io.vn/privkey.pem;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $fourume_api http://4ume-api:5088;
    set $fourume_admin http://4ume-admin:80;

    client_max_body_size 16m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass $fourume_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass $fourume_api;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass $fourume_admin;
        proxy_set_header Host $host;
    }
}
